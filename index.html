<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9b2bb">
<title>あさのじゅんびボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* タブレット用：ボードだけを表示する版 */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
:root {
  --page: #eef1f4;
  --ink: #23282e;
  --muted: #5b6570;
  --line: #d3d9df;
  --panel: #ffffff;
  /* physical board colors stay the same in both themes */
  --board: #fbfcfd;
  --frame: #a9b2bb;
  --frame-dark: #7f8992;
  --board-ink: #2a2f35;
  --hour: #e0473c;
  --minute: #2f6fd6;
  --done: #2f9e5b;
  --done-soft: #e3f4ea;
  --card: #ffffff;
  --card-edge: #e3e7eb;
  --goal: #fff4d6;
  --goal-edge: #f0c64a;
  --f-board: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --f-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #171b20; --ink: #e7ebef; --muted: #a2acb6; --line: #2e353d; --panel: #1f252c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #171b20; --ink: #e7ebef; --muted: #a2acb6; --line: #2e353d; --panel: #1f252c;
  color-scheme: dark;
}
body { background: var(--page); color: var(--ink); font-family: var(--f-body); line-height: 1.7; }
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px;
}
.intro h1 { font-family: var(--f-board); font-size: 1.5rem; margin: 0; text-wrap: balance; }
.intro p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }

/* ---- whiteboard ---- */
.board {
  background: var(--board);
  color: var(--board-ink);
  border: 12px solid var(--frame);
  border-bottom-width: 18px;
  border-bottom-color: var(--frame-dark);
  border-radius: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18), inset 0 0 0 1px rgba(0,0,0,.04);
  padding: clamp(14px, 3vw, 28px);
  display: grid; gap: 18px;
  font-family: var(--f-board);
}
.now { display: grid; justify-items: center; gap: 6px; background: #fff; border: 2px solid var(--card-edge); border-radius: 24px; padding: 14px 28px 12px; }
.now .clock { width: clamp(150px, 26vw, 210px); max-width: none; }
.now-text { display: flex; align-items: baseline; gap: 10px; }
.now-text b { font-size: 1.05rem; font-weight: 900; }
.now-text span { font-size: .95rem; font-weight: 700; color: #6b747d; font-variant-numeric: tabular-nums; }
.step { position: relative; }
.step.current .clock svg circle:first-of-type { stroke: var(--minute); stroke-width: 5; }
.step.current::before { content: "いま"; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); z-index: 3; background: var(--minute); color: #fff; font-size: .75rem; font-weight: 900; padding: 1px 10px; border-radius: 999px; }
.now-float {
  position: fixed; z-index: 20; left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  display: flex; align-items: center; gap: 10px;
  background: #fff; color: var(--board-ink); font-family: var(--f-board);
  border: 2px solid var(--card-edge); border-radius: 999px; padding: 6px 18px 6px 6px;
  box-shadow: 0 6px 20px rgba(0,0,0,.18);
  opacity: 0; visibility: hidden; transform: translate(-50%, -12px);
  transition: opacity .2s, transform .2s, visibility .2s;
}
.now-float.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
.now-float .clock { width: clamp(84px, 18vw, 110px); max-width: none; flex: none; }
.now-float b { display: block; font-size: .85rem; font-weight: 900; white-space: nowrap; }
.now-float span { font-size: 1.1rem; font-weight: 900; color: #4a535c; font-variant-numeric: tabular-nums; }
.board-head { display: grid; justify-items: center; gap: 12px; text-align: center; }
.goal.current { border-style: solid; border-color: var(--minute); box-shadow: 0 0 0 3px rgba(47,111,214,.18); }
.board-head h2 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.3rem); font-weight: 900; letter-spacing: .06em; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: .85rem; font-weight: 700; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; height: 5px; border-radius: 3px; }
.legend .h i { width: 16px; background: var(--hour); }
.legend .m i { width: 26px; background: var(--minute); }

.steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 18px); }
@media (max-width: 860px) { .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 460px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.step { display: grid; gap: 8px; justify-items: center; }
.clock { width: 100%; max-width: 128px; aspect-ratio: 1; }
.clock svg { width: 100%; height: 100%; display: block; }
.time { font-size: .8rem; font-weight: 700; color: #6b747d; font-variant-numeric: tabular-nums; }

.card {
  width: 100%; max-width: 140px; aspect-ratio: 1;
  perspective: 700px; border: 0; padding: 0; background: none; cursor: pointer;
  font: inherit; color: inherit;
}
.card:focus-visible { outline: 3px solid var(--minute); outline-offset: 4px; border-radius: 14px; }
.card { display: block; }
.flip { display: block; position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.3,1.2); }
.card[aria-pressed="true"] .flip { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 14px; display: grid; place-items: center; align-content: center; gap: 2px;
  box-shadow: 0 3px 0 rgba(0,0,0,.08), 0 6px 14px rgba(0,0,0,.08);
}
.front { background: var(--card); border: 2px solid var(--card-edge); }
.front .pic { font-size: clamp(2.2rem, 6vw, 3.2rem); line-height: 1.1; }
.front .word { font-size: clamp(.85rem, 2vw, 1.1rem); font-weight: 900; letter-spacing: .02em; text-align: center; line-height: 1.3; padding: 0 6px; white-space: pre-line; }
.back { background: var(--done-soft); border: 2px solid var(--done); color: var(--done); transform: rotateY(180deg); }
.back .stamp { font-size: clamp(2.2rem, 6vw, 3rem); line-height: 1; }
.back .word { font-size: clamp(1rem, 2.4vw, 1.25rem); font-weight: 900; }
.magnet { position: absolute; top: -6px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ff9a8f, var(--hour)); box-shadow: 0 2px 3px rgba(0,0,0,.25); z-index: 2; }
.back .magnet { background: radial-gradient(circle at 35% 35%, #8fd9ad, var(--done)); }

.goal {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 24px;
  background: var(--goal); border: 3px dashed var(--goal-edge); border-radius: 16px; padding: 14px 18px;
}
.goal .clock { width: 96px; flex: none; }
.goal-text { display: grid; gap: 2px; text-align: center; }
.goal-text strong { font-size: clamp(1.4rem, 3.6vw, 1.9rem); font-weight: 900; letter-spacing: .08em; }
.goal-text span { font-size: .9rem; font-weight: 700; color: #6b5a1e; }
.stickers { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.slot { display: grid; justify-items: center; gap: 2px; border: 0; padding: 0; background: none; font: inherit; color: #6b5a1e; cursor: pointer; }
.slot .seal { width: 48px; height: 48px; border-radius: 50%; border: 2px dashed #d7b445; background: rgba(255,255,255,.5); display: grid; place-items: center; font-size: 1.6rem; line-height: 1; }
.slot .day { font-size: .75rem; font-weight: 900; }
.slot[aria-pressed="true"] .seal { border-style: solid; background: #fff; animation: pop .35s cubic-bezier(.3,.7,.3,1.6); }
.slot:focus-visible { outline: 3px solid var(--minute); outline-offset: 3px; border-radius: 12px; }
@keyframes pop { from { transform: scale(.4) rotate(-20deg); } to { transform: scale(1) rotate(0); } }

.board-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: .8rem; color: #6b747d; }
.reset { font: inherit; font-weight: 700; font-size: .8rem; border: 1px solid #c9d0d6; background: #fff; color: #4a535c; border-radius: 999px; padding: 4px 14px; cursor: pointer; }
.reset:focus-visible { outline: 3px solid var(--minute); outline-offset: 2px; }
.foot-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wake { font-size: .75rem; font-weight: 700; color: #6b747d; }

/* ---- notes ---- */
.notes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 800px) { .notes { grid-template-columns: 1fr; } }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.note h3 { margin: 0 0 6px; font-family: var(--f-board); font-size: 1.05rem; }
.note p, .note li { font-size: .9rem; margin: 0; }
.note ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.note .tag { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin-bottom: 2px; }
.mini-card { display: flex; gap: 10px; margin-top: 10px; }
.mini-card div { flex: 1; aspect-ratio: 1; max-width: 84px; border-radius: 10px; display: grid; place-items: center; align-content: center; font-family: var(--f-board); font-weight: 900; font-size: .8rem; }
.mini-card .f { background: #fff; color: #2a2f35; border: 2px solid var(--card-edge); }
.mini-card .b { background: var(--done-soft); color: var(--done); border: 2px solid var(--done); }
.mini-card em { font-style: normal; font-size: 1.6rem; line-height: 1.1; }
.small { color: var(--muted); font-size: .8rem !important; margin-top: 8px !important; }

@media (prefers-reduced-motion: reduce) { .now-float { transition: none; } .flip { transition: none; } .slot[aria-pressed="true"] .seal { animation: none; } }
</style>
</head>
<body>

<div class="now-float" id="now-float" aria-hidden="true">
  <div class="clock" id="float-clock"></div>
  <div><b>いまの とけい</b><span id="float-digital"></span></div>
</div>

<div class="wrap">

  <section class="board" aria-label="あさの じゅんび ボード">
    <div class="board-head">
      <h2>あさの じゅんび</h2>
      <div class="now">
        <div class="clock" id="now-clock"></div>
        <div class="now-text"><b>いまの とけい</b><span id="now-digital"></span></div>
      </div>
      <div class="legend" aria-label="針の色">
        <span class="h"><i></i>みじかい はり</span>
        <span class="m"><i></i>ながい はり</span>
      </div>
    </div>

    <div class="steps" id="steps"></div>

    <div class="goal" id="goal">
      <div class="clock" data-h="8" data-m="0"></div>
      <div class="goal-text">
        <strong>🚪 しゅっぱつ！</strong>
        <span>8:00 までに ぜんぶ くるっ としたら シールを ぺたっ</span>
      </div>
      <div class="stickers" id="stickers" aria-label="ごほうびシール"></div>
    </div>

    <div class="board-foot">
      <span>※ 時刻は「この時間までに おわらせる」時刻です。</span>
      <div class="foot-tools">
        <span class="wake" id="wake">画面スリープ：確認中</span>
        <button class="reset" id="fullscreen" type="button" hidden>全画面</button>
        <button class="reset" id="reset" type="button">ぜんぶ表にもどす</button>
      </div>
    </div>
  </section>

</div>

<script>
// h:m は「この時間までに おわらせる」時刻
const STEPS = [
  { h: 7, m: 0,  pic: "🌞", word: "おきる" },
  { h: 7, m: 10, pic: "🚽", word: "トイレ\nおむつ" },
  { h: 7, m: 30, pic: "🍚", word: "ごはん" },
  { h: 7, m: 40, pic: "🪥", word: "はみがき" },
  { h: 7, m: 50, pic: "👕", word: "きがえ" },
  { h: 7, m: 55, pic: "🎀", word: "かみのけ" },
];
const GOAL = 8 * 60;           // 8:00 しゅっぱつ
const DAY_START = 6 * 60 + 30; // 6:30 から「いま」を出す
const SEALS = [
  { day: "げつ", seal: "⭐" }, { day: "か", seal: "🌸" }, { day: "すい", seal: "🍓" },
  { day: "もく", seal: "🚗" }, { day: "きん", seal: "🐶" },
];
const KEY = "asa-board-v2";
const today = () => new Date().toDateString();
function load() {
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (v) return v; } catch (e) {}
  return { date: today(), done: STEPS.map(() => false), seals: SEALS.map(() => false) };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const state = load();
if (!Array.isArray(state.done) || state.done.length !== STEPS.length) state.done = STEPS.map(() => false);
if (!Array.isArray(state.seals) || state.seals.length !== SEALS.length) state.seals = SEALS.map(() => false);
if (state.date !== today()) { state.date = today(); state.done = STEPS.map(() => false); save(); }

function clockSVG(h, m, label) {
  const ticks = [];
  for (let i = 0; i < 60; i++) {
    const a = i * 6 * Math.PI / 180, big = i % 5 === 0;
    const r1 = big ? 38 : 41, r2 = 44;
    ticks.push(`<line x1="${50 + r1 * Math.sin(a)}" y1="${50 - r1 * Math.cos(a)}" x2="${50 + r2 * Math.sin(a)}" y2="${50 - r2 * Math.cos(a)}" stroke="#2a2f35" stroke-width="${big ? 1.8 : .6}" stroke-linecap="round"/>`);
  }
  const nums = [];
  for (let n = 1; n <= 12; n++) {
    const a = n * 30 * Math.PI / 180, r = 31, key = n % 3 === 0;
    nums.push(`<text x="${50 + r * Math.sin(a)}" y="${50 - r * Math.cos(a)}" text-anchor="middle" dominant-baseline="central" font-family="Zen Maru Gothic, sans-serif" font-weight="${key ? 900 : 700}" font-size="${key ? 11 : 8}" fill="#2a2f35">${n}</text>`);
  }
  const ha = ((h % 12) + m / 60) * 30, ma = m * 6;
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${label || (h + '時' + (m ? m + '分' : ''))}">
    <circle cx="50" cy="50" r="47" fill="#ffffff" stroke="#2a2f35" stroke-width="3"/>
    ${ticks.join("")}${nums.join("")}
    <line x1="50" y1="50" x2="50" y2="25" stroke="var(--hour)" stroke-width="5.5" stroke-linecap="round" transform="rotate(${ha} 50 50)"/>
    <line x1="50" y1="50" x2="50" y2="12" stroke="var(--minute)" stroke-width="3.5" stroke-linecap="round" transform="rotate(${ma} 50 50)"/>
    <circle cx="50" cy="50" r="3.5" fill="#2a2f35"/>
  </svg>`;
}

const pad = n => String(n).padStart(2, "0");
const stepsEl = document.getElementById("steps");
stepsEl.innerHTML = STEPS.map((s, i) => `
  <div class="step">
    <div class="clock">${clockSVG(s.h, s.m)}</div>
    <div class="time">${s.h}:${pad(s.m)} までに</div>
    <button class="card" type="button" id="card-${i}" aria-pressed="${state.done[i]}" aria-label="${s.word.replace('\n', '・')}">
      <span class="flip">
        <span class="face front"><span class="magnet"></span><span class="pic">${s.pic}</span><span class="word">${s.word}</span></span>
        <span class="face back"><span class="magnet"></span><span class="stamp">💮</span><span class="word">できた！</span></span>
      </span>
    </button>
  </div>`).join("");

document.querySelectorAll(".goal .clock").forEach(el => el.innerHTML = clockSVG(+el.dataset.h, +el.dataset.m));

stepsEl.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  const on = card.getAttribute("aria-pressed") !== "true";
  card.setAttribute("aria-pressed", on);
  state.done[+card.id.split("-")[1]] = on; save();
});

const stickersEl = document.getElementById("stickers");
stickersEl.innerHTML = SEALS.map((s, i) => `
  <button class="slot" type="button" id="slot-${i}" aria-pressed="${state.seals[i]}" aria-label="${s.day}の シール">
    <span class="seal">${state.seals[i] ? s.seal : ""}</span><span class="day">${s.day}</span>
  </button>`).join("");
stickersEl.addEventListener("click", e => {
  const slot = e.target.closest(".slot");
  if (!slot) return;
  const i = +slot.id.split("-")[1], on = !state.seals[i];
  state.seals[i] = on; save();
  slot.setAttribute("aria-pressed", on);
  slot.querySelector(".seal").textContent = on ? SEALS[i].seal : "";
});

const stepEls = [...document.querySelectorAll(".step")];
function tick() {
  const d = new Date();
  const h = d.getHours(), m = d.getMinutes();
  const mf = m + d.getSeconds() / 60;
  document.getElementById("now-clock").innerHTML = clockSVG(h, mf, `いま ${h}時${m}分`);
  document.getElementById("now-digital").textContent = `${h}:${pad(m)}`;
  document.getElementById("float-clock").innerHTML = clockSVG(h, mf, "");
  document.getElementById("float-digital").textContent = `${h}:${pad(m)}`;
  const now = h * 60 + m;
  // いま やること = まだ締め切りが来ていない最初のカード（前のカードの時刻〜このカードの時刻）
  STEPS.forEach((s, i) => {
    const start = i === 0 ? DAY_START : STEPS[i - 1].h * 60 + STEPS[i - 1].m;
    const end = s.h * 60 + s.m;
    stepEls[i].classList.toggle("current", now >= start && now < end);
  });
  const last = STEPS[STEPS.length - 1];
  document.getElementById("goal").classList.toggle("current", now >= last.h * 60 + last.m && now < GOAL);
}
tick();
setInterval(tick, 5000);

// まんなかの時計が画面から外れたら、上に小さな時計を出す
const floatEl = document.getElementById("now-float");
if ("IntersectionObserver" in window) {
  new IntersectionObserver(([en]) => floatEl.classList.toggle("show", !en.isIntersecting && en.boundingClientRect.top < 0))
    .observe(document.querySelector(".now"));
}

// ページを開いている間は画面を消さない（Screen Wake Lock。対応ブラウザのみ）
const wakeEl = document.getElementById("wake");
let wakeLock = null;
async function keepAwake() {
  if (!("wakeLock" in navigator)) { wakeEl.textContent = "画面スリープ：端末の設定どおり"; return; }
  if (document.visibilityState !== "visible" || (wakeLock && !wakeLock.released)) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeEl.textContent = "画面スリープ：しない";
    wakeLock.addEventListener("release", () => { wakeEl.textContent = "画面スリープ：端末の設定どおり"; });
  } catch (e) {
    wakeEl.textContent = "画面スリープ：端末の設定どおり";
  }
}
keepAwake();
document.addEventListener("visibilitychange", keepAwake);
document.addEventListener("click", keepAwake); // タップをきっかけに許可するブラウザ向け

// 全画面ボタン（対応ブラウザのみ表示）
const fsBtn = document.getElementById("fullscreen");
if (document.fullscreenEnabled && document.documentElement.requestFullscreen) {
  fsBtn.hidden = false;
  fsBtn.addEventListener("click", () => {
    const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(() => {});
  });
  document.addEventListener("fullscreenchange", () => { fsBtn.textContent = document.fullscreenElement ? "全画面をやめる" : "全画面"; });
}

document.getElementById("reset").addEventListener("click", () => {
  document.querySelectorAll(".card").forEach(c => c.setAttribute("aria-pressed", "false"));
  state.done = STEPS.map(() => false); save();
});
</script>

</body>
</html>
